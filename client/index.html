<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>The LAB 909. Coming Soon.</title>
    <meta name="description" content="The LAB 909. Sports performance and fitness training in the Inland Empire. Coming soon. Get on the list." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Netlify Forms registration. This static form is what Netlify scans at
      deploy time so it knows the "waitlist" form exists. The real form lives
      inside the React app (client/src/pages/Soon.tsx) and POSTs to "/" with
      form-name=waitlist; submissions land in Netlify dashboard → Forms.
      Required fields must match the React form exactly.
    -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
